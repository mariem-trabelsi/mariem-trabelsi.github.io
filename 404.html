       contenu dans le site plutot que vers une impasse. -->

    var m = location.pathname.match(/^\/(post|project|case|module)\/([^/]+)\/?$/);
    var s = location.pathname.match(/^\/(posts|bpmn)\/?$/);

    else if (s) location.replace('/#/' + s[1]);
  </script>
